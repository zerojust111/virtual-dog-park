<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Dog Park</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <h1>🐶 Virtual Dog Park</h1>
    <p class="subtitle">Adopt a dog, take care of it, watch it grow.</p>
  </header>

  <main class="layout">
    <!-- Round 1: 狗狗百科，卡片由 script.js 生成 -->
    <section id="encyclopedia" class="panel">
      <h2>Dog Encyclopedia</h2>
      <p class="muted">Meet the dogs waiting in the park.</p>
      <ul id="dog-list" class="dog-grid">
        <!-- JavaScript 会把卡片插到这里 -->
      </ul>
    </section>

    <!-- 第二轮会在这里加“照顾面板” -->
    <section id="care" class="panel">
      <h2>Your Dog</h2>
      <p class="muted">Coming in round 2.</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>Round 0 — scaffold only.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
