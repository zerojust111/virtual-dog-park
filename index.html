<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Dog Park</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <h1>🐶 Virtual Dog Park</h1>
    <p class="subtitle">Adopt a dog, take care of it, watch it grow.</p>
  </header>

  <main class="layout">
    <!-- Round 1: 狗狗百科，卡片由 script.js 生成 -->
    <section id="encyclopedia" class="panel">
      <h2>Dog Encyclopedia</h2>
      <p class="muted">Meet the dogs waiting in the park.</p>
      <ul id="dog-list" class="dog-grid">
        <!-- JavaScript 会把卡片插到这里 -->
      </ul>
    </section>

    <!-- Round 2: 领养 + 喂食 + 玩耍 -->
    <section id="care" class="panel">
      <h2>Your Dog</h2>

      <!-- 还没领养时显示这一块 -->
      <p id="care-empty" class="muted">
        No dog yet — pick one above and press <strong>Adopt me</strong>.
      </p>

      <!-- 领养之后显示这一块（开始时隐藏） -->
      <div id="care-dog" hidden>
        <div class="care-head">
          <span id="care-emoji" class="care-emoji" aria-hidden="true"></span>
          <div>
            <h3 id="care-name"></h3>
            <p id="care-meta" class="dog-meta"></p>
          </div>
        </div>

        <div class="stat">
          <span class="stat-label">Hunger</span>
          <div class="bar"><span id="hunger-bar"></span></div>
          <span id="hunger-value" class="stat-value">5/10</span>
        </div>

        <div class="stat">
          <span class="stat-label">Happiness</span>
          <div class="bar"><span id="happiness-bar"></span></div>
          <span id="happiness-value" class="stat-value">5/10</span>
        </div>

        <!-- Round 3: 成长阶段 + 经验值 -->
        <div class="growth">
          <div class="growth-head">
            <span id="stage-badge" class="badge">🐾 Puppy</span>
            <span id="xp-value" class="stat-value">0 XP</span>
          </div>
          <div class="bar bar-xp"><span id="xp-bar"></span></div>
          <p id="next-stage" class="small muted"></p>
        </div>

        <div class="actions">
          <button id="feed-btn" class="btn" type="button">🍖 Feed</button>
          <button id="play-btn" class="btn" type="button">🎾 Play</button>
          <button id="release-btn" class="btn btn-ghost" type="button">Change dog</button>
          <button id="reset-btn" class="btn btn-ghost" type="button">🗑 Reset progress</button>
        </div>

        <p id="care-message" class="message" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Round 0 — scaffold only.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
